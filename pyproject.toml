[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-parser"
version = "0.0.0"
description = "Document parser and quality layer"
requires-python = ">=3.11"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "app*",
  "api*",
  "backend*",
  "domain*",
  "infra*",
  "quality*",
  "trigger*",
]
exclude = ["tests*", "datasets*", "frontend*", "docs*"]

