[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-parser"
version = "0.0.0"
description = "Document parser and quality layer"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
server = [
  "uvicorn[standard]>=0.30,<1",
]
markitdown = [
  "markitdown[all]>=0.1.0,<1",
]
docling = [
  "docling~=2.120.3",
]
mineru = [
  "mineru[all]>=3.4,<4",
  "httpx>=0.27,<1",
  "requests>=2.31",
]
ocr = [
  "rapidocr>=3,<4",
  "onnxruntime>=1.18,<2",
  "pillow>=10,<12",
]
all-parsers = [
  "markitdown[all]>=0.1.0,<1",
  "docling~=2.120.3",
  "mineru[all]>=3.4,<4",
  "rapidocr>=3,<4",
  "onnxruntime>=1.18,<2",
  "pillow>=10,<12",
  "httpx>=0.27,<1",
  "requests>=2.31",
]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "requests>=2.31",
  "pdfplumber>=0.11",
]

[tool.setuptools]
packages = [
  "document_parser",
  "benchmarks",
  "benchmarks.quality_baseline",
  "document_parser.backend",
  "document_parser.common",
  "document_parser.composition",
  "document_parser.core",
  "document_parser.normalizers",
  "document_parser.orchestration",
  "document_parser.parsers",
  "document_parser.parsers.anydoc",
  "document_parser.parsers.docling",
  "document_parser.parsers.markitdown",
  "document_parser.parsers.mineru",
  "document_parser.parsers.ocr",
  "document_parser.routing",
  "quality",
  "quality.builders",
  "quality.evidence",
  "quality.gates",
  "quality.packaging",
  "quality.repairs",
  "quality.representations",
  "quality.rules",
  "tools",
]
# The project root is itself a package directory.  Never infer arbitrary files
# below it as package data: generated bytecode and test/build artifacts must not
# become release payloads.
include-package-data = false

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*", "*/__pycache__/*", "**/__pycache__/*"]

[tool.setuptools.package-dir]
document_parser = "."
"document_parser.backend" = "backend"
"document_parser.common" = "common"
"document_parser.composition" = "composition"
"document_parser.core" = "core"
"document_parser.normalizers" = "normalizers"
"document_parser.orchestration" = "orchestration"
"document_parser.parsers" = "parsers"
"document_parser.parsers.anydoc" = "parsers/anydoc"
"document_parser.parsers.docling" = "parsers/docling"
"document_parser.parsers.markitdown" = "parsers/markitdown"
"document_parser.parsers.mineru" = "parsers/mineru"
"document_parser.parsers.ocr" = "parsers/ocr"
"document_parser.routing" = "routing"
