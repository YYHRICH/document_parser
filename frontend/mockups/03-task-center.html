<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>处理中心｜文档处理中心</title>
  <style>
    :root{--ink:#172033;--muted:#68758a;--line:#e2e8f1;--paper:#fff;--canvas:#f5f7fb;--blue:#285fe9;--blue-dark:#194ac2;--blue-soft:#eaf0ff;--teal:#157b68;--teal-soft:#e8f7f2;--amber:#a96519;--amber-soft:#fff4e3;--red:#b74451;--red-soft:#fff1f2;--shadow:0 15px 42px rgba(25,43,72,.08)}
    *{box-sizing:border-box}body{min-width:320px;margin:0;background:radial-gradient(circle at 2% 0,#e9efff 0,transparent 30rem),radial-gradient(circle at 100% 5%,#eefaf6 0,transparent 24rem),var(--canvas);color:var(--ink);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}a{color:inherit}button{font:inherit}button,.button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #9db8ff;outline-offset:3px}.lucide-icon{display:block;width:16px;height:16px;flex:0 0 auto}.shell{max-width:1320px;margin:0 auto;padding:24px 30px 72px}.topbar,.brand,.top-actions,.page-head,.summary-head,.file-head,.file-meta,.row-actions,.download-wrap,.download-menu,.status-summary,.empty-state{display:flex;align-items:center}.topbar{justify-content:space-between;gap:20px;margin-bottom:34px}.brand{gap:11px;color:inherit;text-decoration:none}.brand-mark{display:grid;width:37px;height:37px;place-items:center;border-radius:11px;background:linear-gradient(135deg,#2d65ed,#1949bf);color:#fff;box-shadow:0 8px 18px rgba(40,95,233,.25)}.brand-mark .lucide-icon{width:22px;height:22px}.brand strong{display:block;font-size:16px}.brand span{color:var(--muted);font-size:12px}.top-actions a{color:var(--muted);font-weight:750;text-decoration:none}.top-actions a:hover{color:var(--blue)}
    .page-head{justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px}.eyebrow{display:block;color:var(--blue);font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:7px 0 8px;font-size:clamp(27px,4vw,38px);letter-spacing:-.045em;line-height:1.16}.intro{max-width:700px;margin:0;color:var(--muted);font-size:15px}.download-wrap{position:relative;flex:0 0 auto}.download{display:inline-flex;min-height:42px;align-items:center;justify-content:center;gap:8px;padding:0 15px;border:1px solid var(--blue);border-radius:11px;background:var(--blue);color:#fff;font-weight:800;box-shadow:0 8px 16px rgba(40,95,233,.22);transition:.16s}.download:hover{background:var(--blue-dark);border-color:var(--blue-dark)}.download-menu{position:absolute;z-index:10;top:calc(100% + 8px);right:0;width:min(340px,calc(100vw - 30px));display:grid;gap:3px;padding:7px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(-5px);transition:.16s}.download-wrap:hover .download-menu,.download-wrap.open .download-menu,.download-wrap:focus-within .download-menu{opacity:1;visibility:visible;transform:none}.package{width:100%;padding:10px 11px;border:0;border-radius:9px;background:#fff;color:var(--ink);text-align:left}.package:hover{background:#f2f6ff}.package strong{display:block;font-size:13px}.package span{display:block;margin-top:2px;color:var(--muted);font-size:12px}
    .card{border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:var(--shadow)}.summary-card{margin-bottom:18px;padding:19px 20px}.summary-head{justify-content:space-between;gap:16px;margin-bottom:13px}.summary-head h2,.file-head h2{margin:0;font-size:18px;letter-spacing:-.02em}.summary-head p,.file-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.show-all{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:800}.show-all:hover{text-decoration:underline}.status-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.status-total{min-height:87px;padding:13px;border:1px solid #e8edf5;border-radius:12px;background:#fbfcfe;color:var(--ink);text-align:left;transition:.16s}.status-total:hover{border-color:#becdf1;background:#f6f8ff;transform:translateY(-1px)}.status-total[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px #dbe5ff}.status-total strong{display:block;font-size:25px;line-height:1.05;letter-spacing:-.04em}.status-total>.status-label{display:flex;align-items:center;gap:6px;margin-top:7px;color:var(--muted);font-size:12px;font-weight:750}.status-total>.status-label .lucide-icon{width:16px;height:16px}.status-total.processing strong{color:var(--blue)}.status-total.review strong{color:var(--amber)}.status-total.ready strong{color:var(--teal)}.status-total.failed strong{color:var(--red)}
    .file-card{overflow:hidden}.file-head{justify-content:space-between;gap:16px;padding:19px 20px;border-bottom:1px solid #edf0f5}.file-count{flex:0 0 auto;padding:5px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:800;white-space:nowrap}.file-list{padding:7px}.file-row{display:grid;grid-template-columns:43px minmax(215px,1.25fr) minmax(145px,.7fr) minmax(190px,.95fr) auto;gap:14px;align-items:center;padding:14px;border-radius:13px}.file-row:hover{background:#f7f9fd}.file-icon{display:grid;width:43px;height:44px;place-items:center;border-radius:10px;background:var(--blue-soft);color:var(--blue)}.file-icon .lucide-icon{width:16px;height:16px}.file-icon.pdf{background:#fff0f1;color:#b94551}.file-icon.sheet{background:#e8f7f1;color:#13775f}.file-icon.image{background:#f6edff;color:#8a5aab}.file-name{min-width:0}.file-name strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.file-meta{flex-wrap:wrap;gap:5px 8px;margin-top:4px;color:var(--muted);font-size:12px}.row-label{display:block;margin-bottom:5px;color:#718096;font-size:11px}.status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:850;white-space:nowrap}.status-pill .lucide-icon{width:16px;height:16px}.status-pill.processing{background:var(--blue-soft);color:var(--blue)}.status-pill.review{background:var(--amber-soft);color:#94601a}.status-pill.ready{background:var(--teal-soft);color:var(--teal)}.status-pill.failed{background:var(--red-soft);color:var(--red)}.file-detail{color:#4f5b6e;font-size:12px}.row-actions{justify-content:flex-end}.action{display:inline-flex;min-height:34px;align-items:center;justify-content:center;gap:6px;padding:0 10px;border:1px solid #bfd0fa;border-radius:9px;background:#fff;color:var(--blue);font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap;transition:.16s}.action:hover{border-color:var(--blue);background:#f2f5ff}.action.primary{border-color:var(--blue);background:var(--blue);color:#fff}.action.primary:hover{border-color:var(--blue-dark);background:var(--blue-dark)}.action.failed{border-color:#ebc3c8;color:var(--red)}.action.failed:hover{background:var(--red-soft);border-color:var(--red)}
    .empty-state{min-height:285px;justify-content:center;padding:34px;text-align:center}.empty-state>div{max-width:420px}.empty-icon{display:grid;width:52px;height:52px;place-items:center;margin:0 auto 13px;border-radius:16px;background:var(--blue-soft);color:var(--blue)}.empty-icon .lucide-icon{width:28px;height:28px}.empty-state h2{margin:0;font-size:20px}.empty-state p{margin:7px 0 18px;color:var(--muted)}.upload-button{display:inline-flex;min-height:39px;align-items:center;justify-content:center;padding:0 13px;border:1px solid var(--blue);border-radius:10px;background:var(--blue);color:#fff;font-size:13px;font-weight:800;text-decoration:none}.upload-button:hover{background:var(--blue-dark);border-color:var(--blue-dark)}.filtered-empty{padding:30px 15px;color:var(--muted);text-align:center}.filtered-empty button{margin-left:6px;border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:800}.filtered-empty button:hover{text-decoration:underline}.toast{position:fixed;right:22px;bottom:22px;z-index:20;max-width:min(370px,calc(100vw - 44px));padding:12px 14px;border-radius:11px;background:#21304b;color:#fff;box-shadow:0 15px 35px rgba(12,24,48,.23);font-size:13px;opacity:0;pointer-events:none;transform:translateY(10px);transition:.18s}.toast.show{opacity:1;transform:translateY(0)}[hidden]{display:none!important}
    @media(max-width:1020px){.file-row{grid-template-columns:43px minmax(0,1fr) minmax(150px,.8fr) auto}.file-row .detail-column{display:none}}@media(max-width:720px){.shell{padding:18px 14px 58px}.topbar{align-items:flex-start;flex-direction:column;margin-bottom:25px}.page-head{align-items:flex-start;flex-direction:column}.download-wrap,.download{width:100%}.download-menu{right:auto;left:0;width:100%}.status-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.summary-card,.file-head{padding:17px}.summary-head,.file-head{align-items:flex-start;flex-direction:column}.file-row{grid-template-columns:43px minmax(0,1fr);gap:9px;padding:13px}.file-row .status-column,.file-row .detail-column,.file-row .row-actions{grid-column:2}.row-label{display:inline;margin-right:6px}.row-actions{justify-content:flex-start}.file-icon{grid-row:span 4}.empty-state{min-height:240px;padding:25px 18px}}@media(max-width:410px){.status-summary{gap:7px}.status-total{min-height:78px;padding:10px}.status-total strong{font-size:22px}.status-total span{margin-top:5px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="04-batch-upload.html" aria-label="返回上传文件">
        <span class="brand-mark" data-icon="files" data-icon-class="icon icon-brand" aria-hidden="true"></span>
        <span><strong>文档处理中心</strong><span>处理中心</span></span>
      </a>
      <nav class="top-actions" aria-label="页面操作"><a href="04-batch-upload.html">上传文件</a></nav>
    </header>

    <section class="page-head" aria-labelledby="pageTitle">
      <div>
        <span class="eyebrow">处理任务</span>
        <h1 id="pageTitle">处理中心</h1>
        <p class="intro" id="pageIntro">查看每份文件的处理情况，并继续下一步操作。</p>
      </div>
      <div class="download-wrap" id="downloadWrap" hidden>
        <button class="download" id="downloadButton" type="button" aria-expanded="false" aria-controls="downloadMenu"><span data-icon="download" data-icon-class="icon icon-download" aria-hidden="true"></span><span>下载</span><span data-icon="chevron-down" data-icon-class="icon icon-chevron" aria-hidden="true"></span></button>
        <div class="download-menu" id="downloadMenu" role="menu" aria-label="选择下载内容">
          <button class="package" type="button" role="menuitem" data-artifact="original"><strong>原始解析压缩包</strong><span id="originalScope">包含 0 份文件。</span></button>
          <button class="package" type="button" role="menuitem" data-artifact="optimized"><strong>优化后文档压缩包</strong><span id="optimizedScope">包含 0 份文件。</span></button>
        </div>
      </div>
    </section>

    <section class="card summary-card" id="summaryCard" aria-labelledby="summaryTitle" hidden>
      <div class="summary-head">
        <div><h2 id="summaryTitle">文件状态</h2><p id="summaryCopy">点击状态可查看对应文件。</p></div>
        <button class="show-all" id="showAll" type="button" hidden>显示全部文件</button>
      </div>
      <div class="status-summary" id="statusSummary" aria-label="按状态查看文件"></div>
    </section>

    <section class="card file-card" id="fileCard" aria-labelledby="fileTitle" hidden>
      <header class="file-head">
        <div><h2 id="fileTitle">文件列表</h2><p id="fileCopy">每份文件都可以单独查看和继续处理。</p></div>
        <span class="file-count" id="fileCount">0 份文件</span>
      </header>
      <div class="file-list" id="fileList" aria-live="polite"></div>
    </section>

    <section class="card empty-state" id="emptyState" aria-labelledby="emptyTitle" hidden>
      <div>
        <div class="empty-icon" data-icon="upload" data-icon-class="icon icon-empty" aria-hidden="true"></div>
        <h2 id="emptyTitle">还没有文件</h2>
        <p id="emptyCopy">上传文件后，您可以在这里查看每一份文件的处理情况和结果。</p>
        <a class="upload-button" href="04-batch-upload.html">上传文件</a>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/lucide-icons.js"></script>
  <script src="task-demo.js"></script>
  <script>
    (function () {
      "use strict";
      var api = window.DocumentTaskDemo;
      var query = new URLSearchParams(window.location.search);
      var taskId = query.get("task") || query.get("batch") || "";
      var state = { task: null, files: [], filter: "all", counts: null, scopes: {} };
      var toastTimer;
      var elements = {
        intro: document.getElementById("pageIntro"),
        downloadWrap: document.getElementById("downloadWrap"),
        downloadButton: document.getElementById("downloadButton"),
        downloadMenu: document.getElementById("downloadMenu"),
        originalScope: document.getElementById("originalScope"),
        optimizedScope: document.getElementById("optimizedScope"),
        summaryCard: document.getElementById("summaryCard"),
        summary: document.getElementById("statusSummary"),
        summaryCopy: document.getElementById("summaryCopy"),
        showAll: document.getElementById("showAll"),
        fileCard: document.getElementById("fileCard"),
        fileList: document.getElementById("fileList"),
        fileCount: document.getElementById("fileCount"),
        emptyState: document.getElementById("emptyState"),
        emptyTitle: document.getElementById("emptyTitle"),
        emptyCopy: document.getElementById("emptyCopy"),
        toast: document.getElementById("toast")
      };

      function iconSvg(name, className, title) {
        if (!window.MockIcons || typeof window.MockIcons.svg !== "function") return "";
        return window.MockIcons.svg(name, className || "icon", title || "");
      }

      function statusIcon(status) {
        return { processing: "loader-circle", review: "circle-alert", ready: "circle-check-big", failed: "circle-x" }[status] || "circle-x";
      }

      function fileIconName(extension) {
        if (["XLS", "XLSX", "CSV"].indexOf(extension) >= 0) return "file-spreadsheet";
        if (["PNG", "JPG", "JPEG", "WEBP"].indexOf(extension) >= 0) return "file-image";
        return "file-text";
      }

      if (window.MockIcons && typeof window.MockIcons.mount === "function") window.MockIcons.mount(document);

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>'"]/g, function (character) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character];
        });
      }

      function toNumber(value) {
        var number = Number(value);
        return Number.isFinite(number) ? number : 0;
      }

      function formatBytes(value) {
        var bytes = toNumber(value);
        if (!bytes) return "文件大小未知";
        if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + " KB";
        return (bytes / 1024 / 1024).toFixed(bytes >= 10 * 1024 * 1024 ? 0 : 1) + " MB";
      }

      function formatFileSize(file) {
        if (file && file.sizeBytes != null) return formatBytes(file.sizeBytes);
        var megabytes = toNumber(file && file.size);
        if (!megabytes) return "文件大小未知";
        if (megabytes < 1) return Math.max(1, Math.round(megabytes * 1024)) + " KB";
        return megabytes.toFixed(megabytes >= 10 ? 0 : 1) + " MB";
      }

      function extensionFor(file) {
        var extension = file && (file.extension || file.type);
        if (extension) return String(extension).toUpperCase();
        var name = file && file.name ? String(file.name) : "文件";
        var index = name.lastIndexOf(".");
        return index > -1 ? name.slice(index + 1).toUpperCase() : "文件";
      }

      function iconClass(extension) {
        if (extension === "PDF") return "pdf";
        if (["XLS", "XLSX", "CSV"].indexOf(extension) >= 0) return "sheet";
        if (["PNG", "JPG", "JPEG", "WEBP"].indexOf(extension) >= 0) return "image";
        return "";
      }

      function normalizeStatus(file) {
        var status = String(file && file.status || "").toLowerCase();
        if (status === "ready") return "ready";
        if (status === "review") return "review";
        if (status === "processing") return "processing";
        return "failed";
      }

      function statusLabel(status) {
        return { processing: "处理中", review: "待确认", ready: "可下载", failed: "处理失败" }[status] || "处理失败";
      }

      function revisionCount(file) {
        var quality = file && file.quality || {};
        var detail = file && file.detail || {};
        var revision = detail.revision || {};
        var revisions = Array.isArray(detail.revisions) ? detail.revisions : (Array.isArray(revision.items) ? revision.items : []);
        return toNumber(quality.revisionCount || revision.total || revisions.length);
      }

      function progressText(file) {
        var progress = file && file.progress;
        if (progress && typeof progress === "object") {
          var current = progress.currentPage || progress.current || progress.value;
          var total = progress.totalPages || progress.total || progress.max;
          if (current && total) return "已处理第 " + current + " / " + total + " 页。";
          if (progress.label) return String(progress.label);
        }
        return "正在处理文档内容。";
      }

      function detailText(file, status) {
        var revisions = revisionCount(file);
        if (status === "processing") return progressText(file);
        if (status === "review") return revisions ? "有 " + revisions + " 项内容等待确认。" : "有内容等待确认。";
        if (status === "ready") return revisions ? "已记录 " + revisions + " 项修改。" : "文档已处理完成。";
        return "这份文件暂时无法完成处理。";
      }

      function resolvedFiles(task) {
        var files = Array.isArray(task && task.files) ? task.files : [];
        return files.map(function (file) {
          if (!api || typeof api.getFile !== "function" || !file || !file.id) return file;
          try { return api.getFile(task, file.id) || file; } catch (error) { return file; }
        });
      }

      function fallbackCounts(files) {
        var result = { total: files.length, processing: 0, review: 0, ready: 0, failed: 0 };
        files.forEach(function (file) { result[normalizeStatus(file)] += 1; });
        return result;
      }

      function taskCounts(task, files) {
        var fallback = fallbackCounts(files);
        var source = {};
        try { source = api && typeof api.getCounts === "function" ? (api.getCounts(task) || {}) : {}; } catch (error) { source = {}; }
        return {
          total: toNumber(source.total) || fallback.total,
          processing: toNumber(source.processing) || fallback.processing,
          review: toNumber(source.review) || fallback.review,
          ready: toNumber(source.ready || source.downloadable) || fallback.ready,
          failed: toNumber(source.failed) + toNumber(source.unsupported) || fallback.failed
        };
      }

      function artifactScope(kind) {
        var fallbackCount = state.files.filter(function (file) {
          var status = normalizeStatus(file);
          return kind === "original" ? status === "ready" || status === "review" : status === "ready";
        }).length;
        try {
          var apiKind = kind === "original" ? "raw" : "optimized";
          var scope = api && typeof api.getArtifactScope === "function" ? api.getArtifactScope(state.task, apiKind) : null;
          if (scope) {
            var included = scope.count != null ? scope.count : (scope.included != null ? scope.included : (Array.isArray(scope.fileIds) ? scope.fileIds.length : (Array.isArray(scope.files) ? scope.files.length : 0)));
            return { kind: kind, count: toNumber(included), total: toNumber(scope.total), pendingCount: toNumber(scope.pendingCount), available: scope.available !== false };
          }
        } catch (error) { /* Use the visible file list as a fallback. */ }
        return { kind: kind, count: fallbackCount, total: state.files.length, pendingCount: Math.max(0, state.files.length - fallbackCount), available: fallbackCount > 0 };
      }

      function scopeText(scope) {
        if (!scope.total || !scope.count) return "当前没有可下载的文件。";
        return scope.count === scope.total ? "包含全部 " + scope.total + " 份文件。" : "当前包含 " + scope.count + "/" + scope.total + " 份文件。";
      }

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () { elements.toast.classList.remove("show"); }, 3000);
      }

      function reviewUrl(file) {
        return "02-review-workbench.html?task=" + encodeURIComponent(state.task.id || taskId) + "&file=" + encodeURIComponent(file.id || "");
      }

      function actionMarkup(file, status) {
        var fileId = escapeHtml(file.id || "");
        if (status === "processing") return '<button class="action" type="button" data-action="progress" data-file-id="' + fileId + '">' + iconSvg("eye", "icon icon-action") + '<span>查看进度</span></button>';
        if (status === "review") return '<a class="action primary" href="' + reviewUrl(file) + '">' + iconSvg("list-checks", "icon icon-action") + '<span>处理待确认项</span></a>';
        if (status === "ready") return '<a class="action primary" href="' + reviewUrl(file) + '">' + iconSvg("eye", "icon icon-action") + '<span>查看文档</span></a>';
        return '<button class="action failed" type="button" data-action="retry" data-file-id="' + fileId + '">' + iconSvg("refresh-cw", "icon icon-action") + '<span>重新处理</span></button>';
      }

      function renderSummary() {
        var cards = [
          ["processing", state.counts.processing],
          ["review", state.counts.review],
          ["ready", state.counts.ready],
          ["failed", state.counts.failed]
        ];
        elements.summary.innerHTML = cards.map(function (card) {
          var status = card[0];
          return '<button class="status-total ' + status + '" type="button" data-filter="' + status + '" aria-pressed="' + String(state.filter === status) + '"><strong>' + card[1] + '</strong><span class="status-label">' + iconSvg(statusIcon(status), "icon icon-status") + statusLabel(status) + '</span></button>';
        }).join("");
        elements.showAll.hidden = state.filter === "all";
        elements.summaryCopy.textContent = state.filter === "all" ? "点击状态可查看对应文件。" : "正在显示“" + statusLabel(state.filter) + "”的文件。";
      }

      function renderFiles() {
        var visible = state.filter === "all" ? state.files : state.files.filter(function (file) { return normalizeStatus(file) === state.filter; });
        elements.fileCount.textContent = state.filter === "all" ? "共 " + state.files.length + " 份文件" : "显示 " + visible.length + " / " + state.files.length + " 份";
        if (!visible.length) {
          elements.fileList.innerHTML = '<div class="filtered-empty">当前没有“' + statusLabel(state.filter) + '”的文件。<button type="button" data-action="show-all">显示全部文件</button></div>';
          return;
        }
        elements.fileList.innerHTML = visible.map(function (file) {
          var extension = extensionFor(file);
          var status = normalizeStatus(file);
          var fileName = escapeHtml(file.name || "未命名文件");
          return '<article class="file-row">'
            + '<div class="file-icon ' + iconClass(extension) + '" aria-hidden="true">' + iconSvg(fileIconName(extension), "icon icon-file") + '</div>'
            + '<div class="file-name"><strong title="' + fileName + '">' + fileName + '</strong><div class="file-meta"><span>' + escapeHtml(extension) + ' · ' + formatFileSize(file) + '</span></div></div>'
            + '<div class="status-column"><span class="row-label">处理状态</span><b class="status-pill ' + status + '">' + iconSvg(statusIcon(status), "icon icon-status") + statusLabel(status) + '</b></div>'
            + '<div class="detail-column"><span class="row-label">当前情况</span><div class="file-detail">' + escapeHtml(detailText(file, status)) + '</div></div>'
            + '<div class="row-actions">' + actionMarkup(file, status) + '</div>'
            + '</article>';
        }).join("");
      }

      function renderTask(task) {
        state.task = task;
        state.files = resolvedFiles(task);
        if (!task || !state.files.length) {
          elements.downloadWrap.hidden = true;
          elements.summaryCard.hidden = true;
          elements.fileCard.hidden = true;
          elements.emptyState.hidden = false;
          elements.intro.textContent = "上传文件后，您可以在这里查看每一份文件的处理情况和结果。";
          return;
        }
        state.counts = taskCounts(task, state.files);
        state.scopes.original = artifactScope("original");
        state.scopes.optimized = artifactScope("optimized");
        elements.originalScope.textContent = scopeText(state.scopes.original);
        elements.optimizedScope.textContent = scopeText(state.scopes.optimized);
        elements.intro.textContent = "查看每份文件的处理情况，并继续下一步操作。";
        elements.emptyState.hidden = true;
        elements.downloadWrap.hidden = false;
        elements.summaryCard.hidden = false;
        elements.fileCard.hidden = false;
        renderSummary();
        renderFiles();
      }

      function refreshTask(message) {
        try {
          var next = api && typeof api.getTask === "function" ? api.getTask(state.task && state.task.id || taskId) : state.task;
          renderTask(next || state.task);
          if (message) showToast(message);
        } catch (error) {
          renderTask(state.task);
          if (message) showToast(message);
        }
      }

      function persistAndRender(nextTask, message) {
        var task = nextTask || state.task;
        try {
          if (api && typeof api.saveTask === "function" && task) task = api.saveTask(task) || task;
        } catch (error) { /* The updated view can still be shown. */ }
        renderTask(task);
        showToast(message);
      }

      function retryFile(fileId) {
        var file = state.files.filter(function (item) { return String(item.id) === String(fileId); })[0];
        if (!file || !api || typeof api.confirmFile !== "function") {
          showToast("暂时无法重新处理这份文件。");
          return;
        }
        try {
          var result = api.confirmFile(state.task, file.id, "reprocess");
          if (result && typeof result.then === "function") {
            result.then(function (nextTask) { persistAndRender(nextTask, "已重新开始处理“" + (file.name || "该文件") + "”。"); }).catch(function () { showToast("暂时无法重新处理这份文件。"); });
          } else {
            persistAndRender(result, "已重新开始处理“" + (file.name || "该文件") + "”。");
          }
        } catch (error) {
          showToast("暂时无法重新处理这份文件。");
        }
      }

      function requestDownload(kind) {
        var scope = artifactScope(kind);
        state.scopes[kind] = scope;
        elements.downloadWrap.classList.remove("open");
        elements.downloadButton.setAttribute("aria-expanded", "false");
        if (!scope.count || !scope.available) {
          showToast("当前没有可下载的文件。");
          return;
        }
        var label = kind === "original" ? "原始解析压缩包" : "优化后文档压缩包";
        showToast(label + "已准备好，包含 " + scope.count + " 份文件。");
      }

      function setDownloadOpen(open) {
        elements.downloadWrap.classList.toggle("open", open);
        elements.downloadButton.setAttribute("aria-expanded", String(open));
      }

      elements.downloadButton.addEventListener("click", function (event) {
        event.stopPropagation();
        setDownloadOpen(!elements.downloadWrap.classList.contains("open"));
      });
      document.addEventListener("click", function (event) {
        if (!elements.downloadWrap.contains(event.target)) setDownloadOpen(false);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          setDownloadOpen(false);
          if (!elements.downloadWrap.hidden) elements.downloadButton.focus();
        }
      });
      elements.downloadMenu.addEventListener("click", function (event) {
        var packageButton = event.target.closest("[data-artifact]");
        if (packageButton) requestDownload(packageButton.dataset.artifact);
      });
      elements.summary.addEventListener("click", function (event) {
        var filterButton = event.target.closest("[data-filter]");
        if (!filterButton) return;
        state.filter = filterButton.dataset.filter;
        renderSummary();
        renderFiles();
      });
      elements.showAll.addEventListener("click", function () {
        state.filter = "all";
        renderSummary();
        renderFiles();
      });
      elements.fileList.addEventListener("click", function (event) {
        var action = event.target.closest("[data-action]");
        if (!action) return;
        if (action.dataset.action === "show-all") {
          state.filter = "all";
          renderSummary();
          renderFiles();
          return;
        }
        var file = state.files.filter(function (item) { return String(item.id) === String(action.dataset.fileId); })[0];
        if (action.dataset.action === "progress") {
          showToast("“" + (file && file.name || "该文件") + "”正在处理中，完成后会显示下一步操作。");
        }
        if (action.dataset.action === "retry") retryFile(action.dataset.fileId);
      });

      if (!api || typeof api.getTask !== "function") {
        elements.emptyTitle.textContent = "暂时无法读取文件";
        elements.emptyCopy.textContent = "请返回上传页面重新开始。";
        renderTask(null);
        return;
      }
      try {
        var task = api.getTask(taskId || undefined);
        if (task && typeof task.then === "function") {
          task.then(renderTask).catch(function () { renderTask(null); });
        } else {
          renderTask(task);
        }
      } catch (error) {
        renderTask(null);
      }
    }());
  </script>
</body>
</html>
