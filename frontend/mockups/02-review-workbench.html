function summary(status){var info=meta(status),metrics=[],revisionCount=changes.length;e.icon.className="status-icon "+info.className;e.icon.innerHTML=icon(info.icon,status==="processing"?"is-spinning":"");e.statusTitle.textContent=info.title;e.statusDescription.textContent=file.detail&&file.detail.summary||info.description;if(status==="processing"){var p=file.progress||{},t=Number(p.total||file.pages||0),c=Number(p.current||0);metrics.push('<span class="metric processing">进度 '+(t?Math.round(c/t*100):0)+'%</span>')}if(revisionCount)metrics.push('<span class="metric '+(status==="review"?"review":"done")+'">'+revisionCount+' 项修改记录</span>');if(file.pages)metrics.push('<span class="metric">共 '+file.pages+' 页</span>');if(file.method)metrics.push('<span class="metric">'+esc(file.method)+'</span>');e.metrics.innerHTML=metrics.join("")}

function recordBlock(change,page,text){return'<section class="mark '+change.state+'" id="'+change.anchor+'" data-page="'+page+'"><span class="mark-icon" aria-hidden="true">'+icon(markIcon(change.state),"")+'</span><p>'+esc(text||change.after||change.title)+'<span class="record-tag">记录 '+(changes.indexOf(change)+1)+'</span></p><div class="output">'+esc(change.after)+'</div></section>'}
function pageRecords(page,revisionMap){var number=pageNo(page.number,1),highlights=Array.isArray(page.highlights)?page.highlights:[],seen={};var marked=highlights.map(function(item,index){var change=revisionMap[item.revisionId];if(change)seen[change.id]=true;if(change)return recordBlock(change,number,item.text);return'<section class="mark fixed" id="page-highlight-'+number+'-'+index+'" data-page="'+number+'"><span class="mark-icon" aria-hidden="true">'+icon("circle-check-big","")+'</span><p>'+esc(item.text||"内容已整理。")+'</p></section>'}).join("");var extras=changes.filter(function(change){return change.page===number&&!seen[change.id]}).map(function(change){return recordBlock(change,number,change.title)}).join("");return marked+extras}
function documentView(){var detail=file.detail||{},pages=Array.isArray(detail.pages)?detail.pages.slice():[],revisionMap={};changes.forEach(function(change){revisionMap[change.id]=change});if(!pages.length&&changes.length){pages=changes.map(function(change){return{number:change.page,heading:detail.heading||stem(file.name),lead:"",paragraphs:[],highlights:[]}}).filter(function(page,index,list){return list.findIndex(function(other){return other.number===page.number})===index})}e.previewHeading.textContent="当前版本";e.previewMeta.textContent=" · "+bytes(file.size)+(file.method?" · "+file.method:"");if(!pages.length){e.content.innerHTML='<section class="document-page" data-page="1"><div class="page-anchor">当前版本</div><h2>'+esc(detail.heading||stem(file.name))+'</h2><p class="lead">'+esc(detail.summary||"当前版本没有可展示的内容。")+'</p><div class="no-records">当前版本没有可展示的修改记录。</div></section>';e.pageMarker.textContent="当前位置：当前版本";return}var represented=pages.map(function(page,index){return pageNo(page.number,index+1)});var body=pages.map(function(page,index){var number=pageNo(page.number,index+1),paragraphs=Array.isArray(page.paragraphs)?page.paragraphs:[];return'<section class="document-page" data-page="'+number+'"><div class="page-anchor">原文第 '+number+' 页</div><h2>'+esc(page.heading||detail.heading||stem(file.name))+'</h2>'+(page.lead?'<p class="lead">'+esc(page.lead)+'</p>':'')+paragraphs.map(function(text){return'<p>'+esc(text)+'</p>'}).join("")+pageRecords(page,revisionMap)+'</section>'}).join("");var extra=changes.filter(function(change){return represented.indexOf(change.page)===-1}).map(function(change){return'<section class="document-page" data-page="'+change.page+'"><div class="page-anchor">原文第 '+change.page+' 页</div><h3>内容片段</h3>'+recordBlock(change,change.page,change.title)+'</section>'}).join("");e.content.innerHTML=body+extra;e.pageMarker.textContent="当前位置：原文第 "+represented[0]+" 页";observe()}
function filters(){var labels={all:"全部",fixed:"已处理",review:"待确认",manual:"需处理"},types=["all","fixed","review","manual"],count={all:changes.length,fixed:0,review:0,manual:0};changes.forEach(function(change){count[change.state]+=1});e.filters.innerHTML=types.filter(function(type){return type==="all"||count[type]>0}).map(function(type){return'<button class="filter '+(activeFilter===type?"active":"")+'" type="button" data-filter="'+type+'">'+labels[type]+" "+count[type]+"</button>"}).join("");e.filters.querySelectorAll("[data-filter]").forEach(function(button){button.addEventListener("click",function(){activeFilter=button.dataset.filter;filters();records()})})}
function records(){var visible=changes.filter(function(change){return activeFilter==="all"||change.state===activeFilter});e.recordContext.textContent=changes.length?"正在显示 "+visible.length+" / "+changes.length+" 项记录；选择记录可定位内容。":"当前版本没有修改记录。";if(!visible.length){e.changeList.innerHTML='<div class="empty-records">当前筛选下没有修改记录。</div>';return}if(!visible.some(function(change){return change.id===selectedId}))selectedId=visible[0].id;e.changeList.innerHTML=visible.map(function(change){return'<button class="change '+(change.id===selectedId?"selected":"")+'" type="button" data-change-id="'+esc(change.id)+'" aria-pressed="'+String(change.id===selectedId)+'"><span class="change-top"><h3>'+esc(change.title)+'</h3><span class="state '+change.state+'">'+stateLabel(change.state)+'</span></span><span class="location">'+esc(change.location)+'</span><span class="explain">'+esc(change.description)+'</span><span class="diff"><span class="snippet before"><b>原始内容</b>'+esc(change.before)+'</span><span class="snippet after"><b>当前版本</b>'+esc(change.after)+'</span></span></button>'}).join("");e.changeList.querySelectorAll("[data-change-id]").forEach(function(button){button.addEventListener("click",function(){select(button.dataset.changeId)})})}
function select(id){var change=changes.find(function(item){return item.id===id});if(!change)return;selectedId=id;records();document.querySelectorAll(".mark.active").forEach(function(item){item.classList.remove("active")});var target=document.getElementById(change.anchor);if(!target)return;target.classList.add("active");e.pageMarker.textContent="当前位置：原文第 "+change.page+" 页";if(window.matchMedia("(min-width:1051px)").matches){var top=target.getBoundingClientRect().top-e.content.getBoundingClientRect().top+e.content.scrollTop-24;e.content.scrollTo({top:Math.max(0,top),behavior:"smooth"})}else target.scrollIntoView({behavior:"smooth",block:"center"})}
function observe(){if(pageObserver)pageObserver.disconnect();if(!("IntersectionObserver"in window))return;var root=window.matchMedia("(min-width:1051px)").matches?e.content:null;pageObserver=new IntersectionObserver(function(entries){entries.filter(function(entry){return entry.isIntersecting}).sort(function(a,b){return b.intersectionRatio-a.intersectionRatio}).slice(0,1).forEach(function(entry){e.pageMarker.textContent="当前位置：原文第 "+entry.target.dataset.page+" 页"})},{root:root,rootMargin:"-20% 0px -60% 0px",threshold:[.1,.5,.9]});Array.from(e.content.querySelectorAll(".document-page")).forEach(function(page){pageObserver.observe(page)})}
function updateStatus(action,button){var text=action==="accept"?"确认采用当前处理结果吗？":"确认重新处理当前文件吗？";if(!window.confirm(text))return;button.disabled=true;button.innerHTML=icon("loader-circle","button-icon is-spinning")+"<span>正在提交</span>";try{var next=api.confirmFile(task,file.id,action);if(!next)throw new Error("save failed");if(action==="accept"){toast("已采用当前结果。");window.setTimeout(function(){window.location.reload()},420)}else{toast("已开始重新处理。");window.setTimeout(function(){window.location.href=centerUrl(task.id)},420)}}catch(error){button.disabled=false;button.innerHTML=action==="accept"?icon("circle-check-big","button-icon")+"<span>采用当前结果</span>":icon("refresh-cw","button-icon")+"<span>重新处理</span>";toast("操作未完成，请稍后再试。")}}
function init(){if(!api||typeof api.getTask!=="function"){empty("暂时无法读取文档","任务数据尚未准备好，请返回处理中心后重新打开文档。");return}task=api.getTask(requestedTaskId||undefined);if(!task||!task.id){empty("未找到处理任务","该处理任务可能已失效或不属于当前会话。");return}file=api.getFile?api.getFile(task,requestedFileId):task.files&&task.files.find(function(item){return item.id===requestedFileId});if(!file&&!requestedFileId&&task.files&&task.files.length===1)file=task.files[0];if(!file){empty("未找到文档","请从处理中心选择需要查看的文件。");return}var status=file.status||"failed",heading=file.detail&&file.detail.heading||stem(file.name);changes=createChanges(file);e.backLink.href=centerUrl(task.id);e.crumbFile.textContent=file.name||heading;e.title.textContent=heading;e.version.textContent=file.version?"版本 "+file.version:"当前版本";document.title=heading+"｜文档详情";summary(status);actions(status);if(status==="processing"||status==="failed"){renderPanel(status);return}e.panel.hidden=true;e.workspace.hidden=false;documentView();filters();records()}
if(icons&&typeof icons.mount==="function")icons.mount(document);
init()
}());
