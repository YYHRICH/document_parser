<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0e7490"/></marker>
  </defs>
  <rect width="1100" height="840" fill="#f8fafc"/>
  <text x="30" y="42" font-size="26" font-weight="bold" fill="#0f172a">文档解析平台 · 系统上下文图</text>
  <text x="30" y="68" font-size="14" fill="#64748b">业务视角：谁在用、平台做什么、依赖哪些外部系统（不涉及任何代码字段）</text>

  <rect x="60" y="110" width="300" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="142" font-size="16" font-weight="bold" fill="#075985">业务用户</text>
  <text x="80" y="168" font-size="13" fill="#0c4a6e">通过 Web 门户提交文档</text>
  <text x="80" y="190" font-size="13" fill="#0c4a6e">查看解析结果与质量报告</text>

  <rect x="740" y="110" width="300" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="760" y="142" font-size="16" font-weight="bold" fill="#075985">集成方 / 运维</text>
  <text x="760" y="168" font-size="13" fill="#0c4a6e">命令行批量提交</text>
  <text x="760" y="190" font-size="13" fill="#0c4a6e">脚本化接入与运维查询</text>

  <rect x="330" y="260" width="440" height="300" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="355" y="298" font-size="20" font-weight="bold" fill="#78350f">文档解析平台</text>
  <text x="355" y="326" font-size="13" fill="#92400e">一站式文档理解与质量准入</text>
  <line x1="355" y1="340" x2="745" y2="340" stroke="#fcd34d" stroke-width="2"/>
  <text x="355" y="368" font-size="13.5" fill="#44403c">· 多格式文档接入（文本 / PDF / Office / 图片 / 网页）</text>
  <text x="355" y="396" font-size="13.5" fill="#44403c">· 智能路由：按文档类型自动选择解析方案</text>
  <text x="355" y="424" font-size="13.5" fill="#44403c">· 多引擎协同解析，失败自动降级</text>
  <text x="355" y="452" font-size="13.5" fill="#44403c">· 质量检查：规则门禁 + 自动修复</text>
  <text x="355" y="480" font-size="13.5" fill="#44403c">· 结果归档：结构化结果 + 证据 + 质量报告</text>
  <text x="355" y="516" font-size="12.5" fill="#a16207">支持 Web / 命令行双入口，异步消息接入规划中</text>

  <rect x="30" y="420" width="250" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="50" y="452" font-size="15" font-weight="bold" fill="#5b21b6">解析引擎（外部）</text>
  <text x="50" y="478" font-size="13" fill="#4c1d95">文本 / PDF / Office / 图片</text>
  <text x="50" y="500" font-size="13" fill="#4c1d95">多厂家引擎按需调用</text>

  <rect x="30" y="590" width="250" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="50" y="622" font-size="15" font-weight="bold" fill="#5b21b6">大模型服务</text>
  <text x="50" y="648" font-size="13" fill="#4c1d95">语义质量评估（规划中）</text>
  <text x="50" y="668" font-size="12" fill="#7c3aed">规则保底 + 大模型增强</text>

  <rect x="820" y="420" width="250" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="840" y="452" font-size="15" font-weight="bold" fill="#5b21b6">对象存储（外部）</text>
  <text x="840" y="478" font-size="13" fill="#4c1d95">原文与解析结果归档</text>
  <text x="840" y="500" font-size="13" fill="#4c1d95">本地磁盘当前实现，可平滑替换</text>

  <rect x="820" y="590" width="250" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="840" y="622" font-size="15" font-weight="bold" fill="#5b21b6">消息队列</text>
  <text x="840" y="648" font-size="13" fill="#4c1d95">异步任务与事件通知（规划中）</text>

  <rect x="330" y="700" width="440" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="355" y="732" font-size="16" font-weight="bold" fill="#14532d">下游消费方</text>
  <text x="355" y="758" font-size="13" fill="#166534">知识库 / 搜索 / 业务系统</text>
  <text x="355" y="780" font-size="13" fill="#166534">消费结构化结果与质量报告</text>

  <path d="M210 220 L470 262" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="250" y="238" font-size="12" fill="#475569">提交文档 / 查看结果</text>
  <path d="M890 220 L630 262" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="650" y="238" font-size="12" fill="#475569">批量提交 / 运维</text>
  <path d="M280 480 L332 430" fill="none" stroke="#0e7490" stroke-width="2" marker-end="url(#a2)"/>
  <text x="240" y="440" font-size="12" fill="#0e7490">调用解析</text>
  <path d="M280 640 L332 540" fill="none" stroke="#0e7490" stroke-width="2" marker-end="url(#a2)"/>
  <text x="235" y="590" font-size="12" fill="#0e7490">质量评估（规划）</text>
  <path d="M770 440 L822 480" fill="none" stroke="#0e7490" stroke-width="2" marker-end="url(#a2)"/>
  <text x="780" y="452" font-size="12" fill="#0e7490">读写归档</text>
  <path d="M770 540 L822 630" fill="none" stroke="#0e7490" stroke-width="2" marker-end="url(#a2)"/>
  <text x="775" y="600" font-size="12" fill="#0e7490">发布事件（规划）</text>
  <path d="M550 560 L550 700" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <text x="560" y="636" font-size="12" fill="#475569">推送结果与报告</text>
</svg>