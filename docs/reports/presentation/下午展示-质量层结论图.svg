<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#172033}.title{font-size:36px;font-weight:700}.sub{font-size:18px;fill:#526174}.step{font-size:16px;font-weight:700;fill:#1f4f82}.head{font-size:23px;font-weight:700}.body{font-size:17px;fill:#344256}.metric{font-size:30px;font-weight:700;fill:#123f6d}.label{font-size:16px;fill:#475569}.out{font-size:21px;font-weight:700;fill:#fff}.out2{font-size:15px;fill:#dbeafe}</style></defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="64" y="64" class="title">解析质量控制与下游准入</text><text x="64" y="98" class="sub">统一诊断、确定性修复、修复后复检；证据不足的结果不进入 Wiki</text><text x="1536" y="64" text-anchor="end" class="sub">质量层｜叶耀华</text>
<g>
<rect x="64" y="150" width="300" height="210" rx="10" fill="#fff" stroke="#b8c5d6" stroke-width="2"/><rect x="64" y="150" width="300" height="45" rx="10" fill="#eaf2fb"/><text x="88" y="180" class="step">01　统一输入</text><text x="88" y="233" class="head">ParsedDocument</text><text x="88" y="272" class="body">正文与标题结构</text><text x="88" y="302" class="body">表格、图片与 OCR</text><text x="88" y="332" class="body">页码、坐标与来源证据</text>
<path d="M364 255H408" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="150" width="300" height="210" rx="10" fill="#fff" stroke="#b8c5d6" stroke-width="2"/><rect x="420" y="150" width="300" height="45" rx="10" fill="#eaf2fb"/><text x="444" y="180" class="step">02　质量诊断</text><text x="444" y="233" class="head">规则化检查</text><text x="444" y="272" class="body">完整性与可读性</text><text x="444" y="302" class="body">结构与资源完整性</text><text x="444" y="332" class="body">来源与能力可用性</text>
<path d="M720 255H764" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="776" y="150" width="300" height="210" rx="10" fill="#fff" stroke="#d2b579" stroke-width="2"/><rect x="776" y="150" width="300" height="45" rx="10" fill="#fff4dc"/><text x="800" y="180" class="step">03　安全修复</text><text x="800" y="233" class="head">白名单规则</text><text x="800" y="272" class="body">清理行尾空白</text><text x="800" y="302" class="body">规范表格分隔行</text><text x="800" y="332" class="body">HTML 表格转 Markdown</text>
<path d="M1076 255H1120" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="1132" y="150" width="404" height="210" rx="10" fill="#fff" stroke="#79a98b" stroke-width="2"/><rect x="1132" y="150" width="404" height="45" rx="10" fill="#e9f6ee"/><text x="1156" y="180" class="step">04　复检与质量门</text><text x="1156" y="233" class="head">按证据决定去向</text><text x="1156" y="272" class="body">通过：直接交付</text><text x="1156" y="302" class="body">带警告通过：记录不确定性后交付</text><text x="1156" y="332" class="body">拒绝：保留原结果，不进入 Wiki</text>
</g>
<rect x="64" y="410" width="1472" height="145" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="88" y="447" class="head">allin6 回放结果</text><line x1="360" y1="434" x2="360" y2="530" stroke="#e2e8f0"/><line x1="650" y1="434" x2="650" y2="530" stroke="#e2e8f0"/><line x1="940" y1="434" x2="940" y2="530" stroke="#e2e8f0"/><line x1="1230" y1="434" x2="1230" y2="530" stroke="#e2e8f0"/>
<text x="505" y="480" text-anchor="middle" class="metric">777</text><text x="505" y="512" text-anchor="middle" class="label">模型输出单元</text><text x="795" y="480" text-anchor="middle" class="metric">172</text><text x="795" y="512" text-anchor="middle" class="label">发生确定性修复</text><text x="1085" y="480" text-anchor="middle" class="metric">1,450</text><text x="1085" y="512" text-anchor="middle" class="label">白名单修复次数</text><text x="1383" y="480" text-anchor="middle" class="metric">51</text><text x="1383" y="512" text-anchor="middle" class="label">拒绝交付</text>
<rect x="64" y="600" width="900" height="180" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="88" y="640" class="head">已落地的三类修复</text><text x="88" y="684" class="body">QL-RPR-001　行尾空白清理</text><text x="520" y="684" class="body">132 次</text><text x="88" y="722" class="body">QL-RPR-002　Markdown 表格分隔行对齐</text><text x="520" y="722" class="body">9 次</text><text x="88" y="760" class="body">QL-RPR-003　HTML 表格转换为 Markdown</text><text x="520" y="760" class="body">1,309 次；2 次因无法唯一定位而放弃</text>
<rect x="992" y="600" width="544" height="180" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1016" y="640" class="head">自动修复边界</text><text x="1016" y="684" class="body">不补写缺失正文或 OCR 内容</text><text x="1016" y="722" class="body">不猜测表格数值与跨页关系</text><text x="1016" y="760" class="body">无法验证时保留原文并记录问题</text>
<rect x="64" y="824" width="1472" height="54" rx="9" fill="#184d80"/><text x="90" y="858" class="out">下游产物：optimized.md ＋ quality_package.json</text><text x="1510" y="858" text-anchor="end" class="out2">正文用于切分与检索；JSON 保存结构、证据、修复记录和质量结论</text>
</svg>
